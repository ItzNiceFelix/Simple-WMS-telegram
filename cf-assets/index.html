<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#059669">
<title>Simple-WMS-telegram — Fase 0</title>
<style>
:root{--brand:#059669;--bg:#f8fafc;--surface:#fff;--text:#0f172a;--text2:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:520px;text-align:center}
h1{font-size:20px;margin:0 0 8px}.pill{display:inline-block;background:rgba(5,150,105,.12);color:var(--brand);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;margin-bottom:16px}
p{color:var(--text2);font-size:14px}code{background:#f1f5f9;border-radius:6px;padding:2px 6px;font-size:13px}
</style>
</head>
<body>
<main class="card">
<div class="pill">FASE 0 · FONDASI</div>
<h1>Simple-WMS-telegram</h1>
<p>Worker + D1 + Auth hidup. Dashboard penuh menyusul di Fase 1 (paritas Next.js).</p>
<p>Cek <code>/api/health</code> untuk status backend.</p>
</main>
</body>
</html>
