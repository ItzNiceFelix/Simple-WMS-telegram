name: CI (Test)

# Jalankan test otomatis tiap push & PR ke main. Menjaga bug kontrak antar-modul
# (seperti action_type object vs string, kodeBarang vs kode_barang) tidak lolos lagi.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Jalankan test
        run: npm test