name: Sync Master Data (Sheets → Firestore)

# Alur A (bagian 4 skema): searah Sheets → Firestore, terjadwal harian.
# Pakai GitHub Actions bukan Vercel Cron karena Vercel Hobby dibatasi 1x/hari & 2 job saja
# (lihat bagian 2 catatan limit free tier) — GitHub Actions lebih fleksibel kalau nanti perlu
# lebih sering dari 1x/hari.

on:
  schedule:
    # Tiap hari jam 06:00 WIB (23:00 UTC hari sebelumnya)
    - cron: "0 23 * * *"
  workflow_dispatch: {} # bisa dipicu manual dari tab Actions, berguna utk testing

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production # secrets kamu ke-save sbg Environment secret (env "Production"), bukan Repository secret — job wajib declare ini biar bisa akses
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Jalankan sync master data
        run: node scripts/jalankanSyncMasterData.js
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          # Dipakai lib/telegram/notifikasiError.js utk alert owner kalau sync gagal.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
